name: GitHub-Profile-Summary-Cards

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-summary-cards.yml"
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: vitoriamaria-bp
          BRANCH_NAME: "main"
          UTC_OFFSET: -3
          EXCLUDE: "TypeScript"
          AUTO_PUSH: false
          THEME: "github_dark"

      - name: Aplicar identidade visual do portfólio
        shell: bash
        run: |
          find profile-summary-card-output/github_dark -type f -name '*.svg' -print0 | xargs -0 sed -i \
            -e 's/#0d1117/#0F172A/g' \
            -e 's/#2e343b/#334155/g' \
            -e 's/#0366d6/#00C2D1/g' \
            -e 's/#77909c/#E8EDF5/g' \
            -e 's/#8b949e/#FF7A30/g' \
            -e 's/#40c463/#2ECC71/g'

      - name: Salvar cards atualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas estatísticas."
            exit 0
          fi
          git commit -m "Atualiza estatísticas do perfil"
          git push

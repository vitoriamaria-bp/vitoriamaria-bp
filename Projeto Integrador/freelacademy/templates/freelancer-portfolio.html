{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio | FreelAcademy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

    <header class="top-bar">
        <div class="top-bar-left">
            <button class="toggle-sidebar-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
            <a href="{% url 'index' %}" class="logo-top">
                <img src="{% static 'img/logo-passaro-original.svg' %}" alt="FreelAcademy">
                <span>Fr<span style="color: var(--secondary);">ee</span>lAcademy</span>
            </a>
        </div>
        <div class="top-bar-right">
            <button class="notification-btn"><i class="far fa-bell"></i><span class="notification-badge"></span></button>
            <div class="user-menu" tabindex="0">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" class="user-avatar" alt="User">
                <div class="user-info">
                    <span class="user-name">Carlos Mendes</span>
                    <span class="user-role">Freelancer</span>
                </div>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <nav>
                <ul class="sidebar-menu">
                    <li><a href="{% url 'freelancer_home' %}"><i class="fas fa-home"></i> <span>Visão Geral</span></a></li>
                    <li><a href="{% url 'freelancer_buscar_projetos' %}"><i class="fas fa-search"></i> <span>Buscar Projetos</span></a></li>
                    <li><a href="{% url 'freelancer_baixar_app' %}"><i class="fas fa-download"></i> <span>Baixar App Desktop</span></a></li>
                    <li><a href="{% url 'freelancer_portfolio' %}" class="active"><i class="fas fa-star"></i> <span>Meu Portfólio</span></a></li>
                    <li><a href="{% url 'freelancer_chat' %}"><i class="fas fa-comments"></i> <span>Mensagens</span></a></li>
                    <li><a href="{% url 'freelancer_carteira' %}"><i class="fas fa-wallet"></i> <span>Carteira (R$)</span></a></li>
                    <li class="menu-separator"></li>
                    <li><a href="{% url 'freelancer_configuracoes' %}"><i class="fas fa-cog"></i> <span>Configurações</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="{% url 'faq' %}" class="footer-link"><i class="far fa-question-circle"></i> <span>Ajuda</span></a>
                <a href="{% url 'login' %}" class="footer-link" onclick="realizarLogout()">
                    <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            ...content...
        </main>
    </div>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
